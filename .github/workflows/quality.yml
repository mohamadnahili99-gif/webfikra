name: WEBFIKRA quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [redesign-2026]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, TypeScript, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build website
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
